name: Temporary category controls verification

on:
  push:
    branches:
      - codex/category-action-controls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/category-action-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped patch
        run: python tmp/category_controls_patch.py
      - name: JavaScript syntax
        run: node --check public/hap/app.js
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Full build
        run: npm run build
      - name: Install browser test dependency
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start HAP dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/hap-dev.log 2>&1 &
          echo $! > /tmp/hap-dev.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hap-dev.log
          exit 1
      - name: Verify category controls in Chromium
        run: npx playwright test tmp/category_controls.spec.cjs --reporter=line --workers=1
      - name: Diff hygiene
        run: git diff --check
      - name: Commit only verified product and rule changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md public/hap/styles.css
          if git diff --cached --quiet; then
            echo "No verified product changes to commit"
            exit 0
          fi
          git commit -m "fix: compact category action controls"
          git push origin HEAD:codex/category-action-controls
