name: Verify promotion overlap

on:
  push:
    branches:
      - codex/menu-promo-dod-11-1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hap-preview.log 2>&1 &
          echo $! > /tmp/hap-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/r/sofra/admin >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hap-preview.log
          exit 1
      - name: Verify 11.1 promotion geometry
        env:
          HAP_URL: http://127.0.0.1:4173
        run: node scripts/verify-promo-overlap.mjs
