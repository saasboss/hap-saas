name: Temporary Design density fine-tune

on:
  push:
    branches:
      - codex/design-density-finetune
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/design-density-finetune
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped density patch
        run: python tmp/patch_design_density.py
      - name: Verify intended product scope
        run: |
          files="$(git diff --name-only)"
          printf '%s\n' "$files"
          test "$files" = $'public/hap/app.js\npublic/hap/styles.css'
      - name: JavaScript syntax
        run: node --check public/hap/app.js
      - name: Diff hygiene
        run: git diff --check
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Production build
        run: npm run build
      - name: Commit verified product change
        run: |
          if git diff --quiet; then
            echo "No product diff to commit"
            exit 0
          fi
          git config user.name "saasboss"
          git config user.email "businesstidra@gmail.com"
          git add public/hap/app.js public/hap/styles.css
          git commit -m "Tighten Design screen density"
          git push origin HEAD:codex/design-density-finetune
