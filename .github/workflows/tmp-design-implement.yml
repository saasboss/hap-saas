name: Temporary Design implementation

on:
  push:
    branches:
      - codex/design-single-screen-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/design-single-screen-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare audited patch from previous scratch branch
        run: |
          git show origin/codex/design-single-screen:tmp/design_single_screen_patch.py > /tmp/design_patch.py
          git show origin/codex/design-single-screen:tmp/format_design_functions.py > /tmp/format_design.py
      - name: Apply only Design product changes
        run: |
          python /tmp/design_patch.py
          git checkout -- docs/MENU_DESIGN_PROMOTION_PLAN.md docs/PROJECT_STATE.md
      - name: Format only changed Design functions
        run: python /tmp/format_design.py
      - name: Syntax check
        run: node --check public/hap/app.js
      - name: Scope guard
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' public/hap/app.js public/hap/styles.css | sort)"
          test "$changed" = "$expected"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hap/app.js public/hap/styles.css
          git commit -m "refactor: simplify Design into one screen"
          git push origin HEAD:codex/design-single-screen-v2
