name: Apply final DoD correction

on:
  push:
    branches:
      - codex/menu-promo-dod-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/menu-promo-dod-final
      - name: Apply targeted corrections
        run: python scripts/patch-final-dod.py
      - name: Check legacy JavaScript syntax
        run: node --check public/hap/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Commit targeted corrections
        run: |
          if git diff --quiet -- public/hap/app.js scripts/verify-menu-dod-final.mjs AGENTS.md; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "saasboss"
          git config user.email "businesstidra@gmail.com"
          git add public/hap/app.js scripts/verify-menu-dod-final.mjs AGENTS.md
          git commit -m "fix: enforce promotion access and harden verification"
          git push origin HEAD:codex/menu-promo-dod-final
