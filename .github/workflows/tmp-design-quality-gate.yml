name: Temporary Design delivery quality gate

on:
  push:
    branches:
      - codex/design-single-screen-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/design-single-screen-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify exact branch scope
        run: |
          git fetch origin main
          files="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$files"
          test "$files" = $'.github/workflows/tmp-design-quality-gate.yml\npublic/hap/app.js\npublic/hap/styles.css'
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
      - name: Verify formatter baseline is unchanged
        run: |
          git show origin/main:public/hap/app.js > /tmp/main-app.js
          git show origin/main:public/hap/styles.css > /tmp/main-styles.css

          set +e
          npx prettier --check /tmp/main-app.js >/tmp/main-app-prettier.log 2>&1
          main_app=$?
          npx prettier --check public/hap/app.js >/tmp/branch-app-prettier.log 2>&1
          branch_app=$?
          npx prettier --check /tmp/main-styles.css >/tmp/main-css-prettier.log 2>&1
          main_css=$?
          npx prettier --check public/hap/styles.css >/tmp/branch-css-prettier.log 2>&1
          branch_css=$?
          set -e

          echo "main app prettier exit: $main_app"
          echo "branch app prettier exit: $branch_app"
          echo "main css prettier exit: $main_css"
          echo "branch css prettier exit: $branch_css"
          test "$main_app" -eq "$branch_app"
          test "$main_css" -eq "$branch_css"
          grep -F 'transition:background .2s ease;color .2s ease' /tmp/main-styles.css >/dev/null
          grep -F 'transition:background .2s ease;color .2s ease' public/hap/styles.css >/dev/null
      - name: JavaScript syntax check
        run: node --check public/hap/app.js
      - name: Verify no new ESLint errors vs main
        run: |
          cp public/hap/app.js /tmp/branch-app.js
          git show origin/main:public/hap/app.js > public/hap/app.js
          npx eslint public/hap/app.js -f json > /tmp/main-eslint.json || true
          cp /tmp/branch-app.js public/hap/app.js
          npx eslint public/hap/app.js -f json > /tmp/branch-eslint.json || true
          node <<'NODE'
          const fs=require('fs');
          const load=p=>JSON.parse(fs.readFileSync(p,'utf8'))[0]?.messages||[];
          const key=m=>`${m.ruleId||'parser'}\u0000${m.message}`;
          const count=arr=>arr.reduce((map,m)=>(map.set(key(m),(map.get(key(m))||0)+1),map),new Map());
          const main=load('/tmp/main-eslint.json');
          const branch=load('/tmp/branch-eslint.json');
          const a=count(main), b=count(branch);
          const added=[];
          for(const [k,n] of b){ const delta=n-(a.get(k)||0); if(delta>0) added.push({delta,key:k.replace('\u0000',' :: ')}); }
          console.log(`main ESLint messages: ${main.length}`);
          console.log(`branch ESLint messages: ${branch.length}`);
          if(added.length){ console.error('New ESLint regressions:'); for(const x of added) console.error(`+${x.delta} ${x.key}`); process.exit(1); }
          console.log('No new ESLint errors or warnings versus main.');
          NODE
      - name: Production build
        if: always()
        run: npm run build
