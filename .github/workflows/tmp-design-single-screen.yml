name: Temporary Design single-screen verification

on:
  push:
    branches:
      - codex/design-single-screen
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/design-single-screen
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped Design patch
        run: python tmp/design_single_screen_patch.py
      - name: JavaScript syntax
        run: node --check public/hap/app.js
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Full build
        run: npm run build
      - name: Record repository lint baseline
        run: |
          npm run lint > /tmp/full-lint.log 2>&1 || true
          tail -n 12 /tmp/full-lint.log
      - name: Lint changed JavaScript lines
        run: python tmp/check_changed_eslint.py
      - name: Install browser test dependency
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start HAP dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/hap-dev.log 2>&1 &
          echo $! > /tmp/hap-dev.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hap-dev.log
          exit 1
      - name: Verify Design in Chromium
        run: npx playwright test tmp/design_single_screen.spec.cjs --reporter=line --workers=1
      - name: Diff hygiene
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/MENU_DESIGN_PROMOTION_PLAN.md docs/PROJECT_STATE.md public/hap/app.js public/hap/styles.css | sort)"
          test "$changed" = "$expected"
      - name: Commit verified product and state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hap/app.js public/hap/styles.css docs/MENU_DESIGN_PROMOTION_PLAN.md docs/PROJECT_STATE.md
          git commit -m "refactor: simplify Design into one screen"
          git push origin HEAD:codex/design-single-screen
