name: Verify final menu definition of done

on:
  push:
    branches:
      - codex/menu-promo-dod-final

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start browser build
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/hap-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/r/sofra/admin >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hap-dev.log
          exit 1
      - name: Verify 11.4 through 11.10
        env:
          HAP_URL: http://127.0.0.1:4173
        run: node scripts/verify-menu-dod-final.mjs > final-dod-results.json
      - name: Preserve final verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-menu-dod-results
          path: final-dod-results.json
          if-no-files-found: error

# Rerun after the verified Promotions permission correction and fixture hardening.
